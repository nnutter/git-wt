id = "nnutter.timber"
name = "timber"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Open or create a Herdr Space with Timber TUI"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open or Create Space for Timber Worktree"
description = "Open an existing worktree or create a new one"
contexts = ["global"]
command = ["bin/open"]

[[panes]]
id = "create"
title = "Open or Create Space for Timber Worktree"
description = "Open an existing worktree or create a new one"
placement = "popup"
width = "80%"
height = "60%"
command = ["/bin/bash", "bin/create"]
