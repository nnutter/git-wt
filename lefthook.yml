min_version: 1.10.0
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob:
        - "*.go"
        - "**/*.go"
      run: gofumpt -w {staged_files}
      stage_fixed: true

    - name: secrets
      run: gitleaks git --staged --verbose --redact --exit-code 1
